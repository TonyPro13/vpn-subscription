mixed-port: 7890
mode: "rule"
proxy-providers:
  VPN:
    type: "http"
    url: "https://raw.githubusercontent.com/TonyPro13/vpn-subscription/main/output/mihomo-provider.yaml"
    path: "./providers/vpn.yaml"
    interval: 300
    health-check:
      enable: true
      url: "https://cp.cloudflare.com"
      interval: 60
      timeout: 5000
      lazy: false
proxy-groups:
  -
    name: "AUTO"
    type: "url-test"
    use:
      - "VPN"
    tolerance: 30
rules:
  - "MATCH,AUTO"
