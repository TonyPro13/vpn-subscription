name: Refresh VPN subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: vpn-subscription-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install curl, unzip and gzip
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip jq gzip

      - name: Install Xray, sing-box and Mihomo
        run: bash scripts/install_engines.sh

      - name: Check installed engines
        run: |
          test -f bin/xray
          test -f bin/sing-box
          test -f bin/mihomo
          ./bin/xray version
          ./bin/sing-box version
          ./bin/mihomo -v

      - name: Refresh and verify pool
        env:
          CHECK_CONCURRENCY: "20"
          VPN_PROCESS_CONCURRENCY: "40"
          PROBE_TIMEOUT_SECONDS: "9"
        run: python main.py

      - name: Validate Mihomo outputs
        run: python scripts/validate_mihomo_outputs.py

      - name: Commit updated subscription
        run: |
          git config user.name "vpn-subscription-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json output/subscription.txt output/status.json output/mihomo-provider.yaml output/mihomo.yaml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-refresh VPN subscription"
            git push
          fi
